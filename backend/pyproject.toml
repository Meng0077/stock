[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "stock-agent"
version = "0.1.0"
description = "股票研究与模拟交易 Agent 学习项目"
requires-python = ">=3.11"
dependencies = ["zai-sdk==0.2.3", "python-dotenv==1.2.1", "pydantic==2.13.5"]

[tool.setuptools.packages.find]
where = ["src"]

[project.optional-dependencies]
dev = ["pytest==9.1.1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
