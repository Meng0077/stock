services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: stock_agent
      POSTGRES_USER: stock_agent
      POSTGRES_PASSWORD: stock_agent
    ports:
      - "5432:5432"
    volumes:
      - stock_postgres_data:/var/lib/postgresql/data

volumes:
  stock_postgres_data:
